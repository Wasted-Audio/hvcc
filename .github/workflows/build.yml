name: HVCC Build

on: [push, pull_request]

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: true
          submodules: true
      - name: Initialize lfs
        run: git lfs pull
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install poetry poetry-pyinstaller-plugin pyinstaller
      - name: Build binaries
        run: |
          pip install .
          poetry build

      - uses: actions/upload-artifact@v7
        with:
          name: heavy-binary-linux-${{ matrix.arch }}
          path: dist/pyinstaller/manylinux_2_35_${{ matrix.arch }}/Heavy

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: true
          submodules: true
      - name: Initialize lfs
        run: git lfs pull
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install poetry poetry-pyinstaller-plugin pyinstaller
      - name: Build binaries
        run: |
          pip install .
          poetry build

      - uses: actions/upload-artifact@v7
        with:
          name: heavy-binary-windows-x86_64
          path: dist/pyinstaller/win_amd64/Heavy.exe


  build-macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: true
          submodules: true
      - name: Initialize lfs
        run: git lfs pull
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install poetry poetry-pyinstaller-plugin pyinstaller
      - name: Build binaries
        run: |
          pip install .
          poetry build

      - uses: actions/upload-artifact@v7
        with:
          name: heavy-binary-macos-x86_64
          path: dist/pyinstaller/macosx_15_0_x86_64/Heavy
